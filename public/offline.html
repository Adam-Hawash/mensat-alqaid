<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مفيش اتصال — منصة القائد</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#fafafa; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; color:#2D2D2D; }
  .box { text-align:center; padding:2rem; }
  .icon { font-size:64px; margin-bottom:1rem; }
  h1 { font-size:20px; margin:0 0 .5rem; }
  p { color:#666; font-size:14px; margin:0 0 1.5rem; }
  button { background:#2D2D2D; color:#fff; border:0; border-radius:12px; padding:12px 28px; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📶</div>
    <h1>مفيش اتصال بالإنترنت</h1>
    <p>المنصة محتاجة إنترنت شغال — اتأكد من الاتصال واعمل إعادة محاولة</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  <p style="margin:14px 0 0;font-size:13px"><a href="https://project-emt-medical.vercel.app" style="color:#666">أو جرّب اللينك الاحتياطي ←</a></p>
  <script>
  /* (ز17) الأوفلاين الذكي: النت رجع؟ نرجعك للمنصة لوحدك — من غير ما تدوس حاجة */
  (function () {
    function probe() {
      try {
        fetch(location.origin, { cache: 'no-store' }).then(function (r) {
          if (r && r.status < 500) location.reload()
        }).catch(function () {})
      } catch (e) {}
    }
    window.addEventListener('online', function () { setTimeout(probe, 400) })
    setInterval(probe, 8000)
  })()
  </script>
</body>
</html>
